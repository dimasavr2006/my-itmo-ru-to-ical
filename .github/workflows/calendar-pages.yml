name: Update calendar and deploy to Pages

on:
  schedule:
    # UTC: 00:23, 06:23, 12:23, 18:23; Moscow: 03:23, 09:23, 15:23, 21:23.
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - config/**
      - requirements-calendar.txt
      - .github/workflows/calendar-pages.yml

permissions:
  contents: read

concurrency:
  group: calendar-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-calendar.txt
      - name: Install calendar dependencies
        run: python -m pip install -r requirements-calendar.txt
      - name: Export schedule
        env:
          ITMO_ICAL_ISU_USERNAME: ${{ secrets.ITMO_ICAL_ISU_USERNAME }}
          ITMO_ICAL_ISU_PASSWORD: ${{ secrets.ITMO_ICAL_ISU_PASSWORD }}
          ITMO_ICAL_CALENDAR_TOKEN: ${{ secrets.ITMO_ICAL_CALENDAR_TOKEN }}
        run: python src/export_ics.py --non-interactive --pages-dir _site
      - name: Upload only the generated website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy calendar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
